on:
  push:
    branches:
      - "master"

permissions:
  contents: write

name: Build Nightly
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-tags: true
          fetch-depth: 0
          submodules: 'recursive'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Add version
        run: |
          mkdir -p out
          git tag -d nightly || true
          git tag -d db || true
          git describe --tags --dirty > out/version.txt
      - name: Build Web
        run: bash ./scripts/build_webui.sh
      - name: Build controller
        run: |
          export PLATFORMIO_BUILD_FLAGS="'-DNIGHTLY_BUILD'"
          pio run -e controller
          cp .pio/build/controller/firmware.bin out/board-firmware.bin
          cp .pio/build/controller/partitions.bin out/board-partitions.bin
          cp .pio/build/controller/bootloader.bin out/board-bootloader.bin
      - name: Build display (LilyGo)
        run: |
          export PLATFORMIO_BUILD_FLAGS="'-DNIGHTLY_BUILD'"
          pio run -e display
          cp .pio/build/display/firmware.bin out/display-lilygo-firmware.bin
          cp .pio/build/display/partitions.bin out/display-lilygo-partitions.bin
          cp .pio/build/display/bootloader.bin out/display-lilygo-bootloader.bin
      - name: Build display (Waveshare 4.3)
        run: |
          export PLATFORMIO_BUILD_FLAGS="'-DNIGHTLY_BUILD'"
          pio run -e display-ws43
          cp .pio/build/display-ws43/firmware.bin out/display-ws43-firmware.bin
          cp .pio/build/display-ws43/partitions.bin out/display-ws43-partitions.bin
          cp .pio/build/display-ws43/bootloader.bin out/display-ws43-bootloader.bin
      - name: Build headless
        run: |
          export PLATFORMIO_BUILD_FLAGS="'-DNIGHTLY_BUILD'"
          pio run -e display-headless
          cp .pio/build/display-headless/firmware.bin out/display-headless-firmware.bin
          cp .pio/build/display-headless/partitions.bin out/display-headless-partitions.bin
          cp .pio/build/display-headless/bootloader.bin out/display-headless-bootloader.bin
      - name: Build filesystem images and flasher assets
        run: |
          pio run -t buildfs -e display
          cp .pio/build/display/littlefs.bin out/display-lilygo-filesystem.bin

          pio run -t buildfs -e display-ws43
          cp .pio/build/display-ws43/littlefs.bin out/display-ws43-filesystem.bin

          pio run -t buildfs -e display-headless
          cp .pio/build/display-headless/littlefs.bin out/display-headless-filesystem.bin

          cp scripts/flasher/index.html out/index.html
          cp scripts/flasher/manifest-display.json out/manifest-display.json
          cp scripts/flasher/manifest-display-ws43.json out/manifest-display-ws43.json
          cp scripts/flasher/manifest-headless.json out/manifest-headless.json
          cp scripts/flasher/manifest-controller.json out/manifest-controller.json
          cp scripts/flasher/manifest-catalog.json out/manifest-catalog.json
      - name: Validate flasher manifests
        run: python scripts/validate_flasher_manifests.py --out-dir out
      - name: Archive Firmware Files
        uses: actions/upload-artifact@v4
        with:
          name: gaggimate-firmware
          path: "out/*"

  release-nightly:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      pull-requests: write
    steps:
      - name: Download Firmware Files
        uses: actions/download-artifact@v4
        with:
          name: gaggimate-firmware
          path: release
      - name: Update Nightly Release
        uses: andelf/nightly-release@c5ed4bdb7c1da04a4fa1e40bc5e67306f682563b
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: nightly
          name: 'Nightly Release $$'
          prerelease: true
          body: 'Latest nightly release. Flash from https://dulerabbit.github.io/GaggiBre/nightly/ or use the nightly OTA channel.'
          files: |
            release/*
      - name: Deploy to GitHub Pages subdirectory
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./release
          destination_dir: nightly
          publish_branch: gh-pages
