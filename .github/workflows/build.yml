on:
  push:
    tags:
      - "*"

permissions:
  contents: write

name: Build
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-tags: true
          fetch-depth: 0
          submodules: 'recursive'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Add version
        run: |
          mkdir -p out
          git tag -d nightly || true
          git tag -d db || true
          git describe --tags --dirty > out/version.txt
      - name: Build Web
        run: bash ./scripts/build_webui.sh
      - name: Build controller
        run: |
          pio run -e controller
          mv .pio/build/controller/firmware.bin out/board-firmware.bin
          mv .pio/build/controller/partitions.bin out/board-partitions.bin
          mv .pio/build/controller/bootloader.bin out/board-bootloader.bin
      - name: Build display (LilyGo)
        run: |
          pio run -e display
          mv .pio/build/display/firmware.bin out/display-lilygo-firmware.bin
          mv .pio/build/display/partitions.bin out/display-lilygo-partitions.bin
          mv .pio/build/display/bootloader.bin out/display-lilygo-bootloader.bin
      - name: Build display (Waveshare 4.3)
        run: |
          pio run -e display-ws43
          mv .pio/build/display-ws43/firmware.bin out/display-ws43-firmware.bin
          mv .pio/build/display-ws43/partitions.bin out/display-ws43-partitions.bin
          mv .pio/build/display-ws43/bootloader.bin out/display-ws43-bootloader.bin
      - name: Build headless
        run: |
          pio run -e display-headless
          mv .pio/build/display-headless/firmware.bin out/display-headless-firmware.bin
          mv .pio/build/display-headless/partitions.bin out/display-headless-partitions.bin
          mv .pio/build/display-headless/bootloader.bin out/display-headless-bootloader.bin
      - name: Build filesystem images and flasher assets
        run: |
          pio run -t buildfs -e display
          cp .pio/build/display/littlefs.bin out/display-lilygo-filesystem.bin

          pio run -t buildfs -e display-ws43
          cp .pio/build/display-ws43/littlefs.bin out/display-ws43-filesystem.bin

          pio run -t buildfs -e display-headless
          cp .pio/build/display-headless/littlefs.bin out/display-headless-filesystem.bin

          cp scripts/flasher/index.html out/index.html
          cp scripts/flasher/manifest-display.json out/manifest-display.json
          cp scripts/flasher/manifest-display-ws43.json out/manifest-display-ws43.json
          cp scripts/flasher/manifest-headless.json out/manifest-headless.json
          cp scripts/flasher/manifest-controller.json out/manifest-controller.json
          cp scripts/flasher/manifest-catalog.json out/manifest-catalog.json
      - name: Validate flasher manifests
        run: python scripts/validate_flasher_manifests.py --out-dir out
      - name: Stage filesystem upload dirs
        run: |
          mkdir -p upload/controller upload/display upload/display-ws43 upload/headless

          cp out/display-lilygo-filesystem.bin upload/display/filesystem.bin
          cp out/display-ws43-filesystem.bin upload/display-ws43/filesystem.bin
          cp out/display-headless-filesystem.bin upload/headless/filesystem.bin
      - name: Stage upload dirs
        run: |
          cp out/board-firmware.bin upload/controller/firmware.bin
          cp out/board-partitions.bin upload/controller/partitions.bin
          cp out/board-bootloader.bin upload/controller/bootloader.bin

          cp out/display-lilygo-firmware.bin upload/display/firmware.bin
          cp out/display-lilygo-partitions.bin upload/display/partitions.bin
          cp out/display-lilygo-bootloader.bin upload/display/bootloader.bin

          cp out/display-ws43-firmware.bin upload/display-ws43/firmware.bin
          cp out/display-ws43-partitions.bin upload/display-ws43/partitions.bin
          cp out/display-ws43-bootloader.bin upload/display-ws43/bootloader.bin

          cp out/display-headless-firmware.bin upload/headless/firmware.bin
          cp out/display-headless-partitions.bin upload/headless/partitions.bin
          cp out/display-headless-bootloader.bin upload/headless/bootloader.bin
      - uses: ./.github/actions/upload-firmware
        continue-on-error: true
        env:
          UPDATE_SERVER_HOST: ${{ secrets.UPDATE_SERVER_HOST }}
          UPDATE_SERVER_API_KEY: ${{ secrets.UPDATE_SERVER_API_KEY }}
        with:
          channel: 'stable'
          target: 'controller'
          firmware_dir: 'upload/controller'
      - uses: ./.github/actions/upload-firmware
        continue-on-error: true
        env:
          UPDATE_SERVER_HOST: ${{ secrets.UPDATE_SERVER_HOST }}
          UPDATE_SERVER_API_KEY: ${{ secrets.UPDATE_SERVER_API_KEY }}
        with:
          channel: 'stable'
          target: 'display'
          firmware_dir: 'upload/display'
          firmware_files: 'bootloader.bin,partitions.bin,firmware.bin,filesystem.bin'
      - uses: ./.github/actions/upload-firmware
        continue-on-error: true
        env:
          UPDATE_SERVER_HOST: ${{ secrets.UPDATE_SERVER_HOST }}
          UPDATE_SERVER_API_KEY: ${{ secrets.UPDATE_SERVER_API_KEY }}
        with:
          channel: 'stable'
          target: 'headless'
          firmware_dir: 'upload/headless'
          firmware_files: 'bootloader.bin,partitions.bin,firmware.bin,filesystem.bin'
      - name: Archive Firmware Files
        uses: actions/upload-artifact@v4
        with:
          name: gaggimate-firmware
          path: "out/*"

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      pull-requests: write
    steps:
      - name: Download Firmware Files
        uses: actions/download-artifact@v4
        with:
          name: gaggimate-firmware
          path: release
      - name: Release Firmware
        uses: ncipollo/release-action@bcfe5470707e8832e12347755757cec0eb3c22af
        if: startsWith(github.ref, 'refs/tags/')
        with:
          artifacts: release/*.bin
          generateReleaseNotes: true
          allowUpdates: true
          prerelease: ${{ contains(github.ref_name, '-') || contains(github.ref_name, 'rc') }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy to GitHub Pages (stable)
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./release
          destination_dir: stable
          publish_branch: gh-pages
